<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Hostel Admin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Hostel Admin Dashboard</h1>

<h2>Rooms</h2>
<table id="roomsTable"></table>

<h2>Add Student</h2>
<input id="name" placeholder="Name">
<input id="phone" placeholder="Phone">
<input id="roomNo" placeholder="Room No">
<button onclick="addStudent()">Add Student</button>
<p id="studentMsg"></p>

<h2>Students</h2>
<table id="studentsTable"></table>

<h2>Record Fee</h2>
<select id="studentSelect"></select>
<input id="amount" placeholder="Amount">
<button onclick="payFee()">Pay Fee</button>
<p id="feeMsg"></p>

<h2>Fee History</h2>
<select id="feeStudentSelect"></select>
<button onclick="loadFees()">View Fees</button>
<table id="feesTable"></table>


<div id="dashboard" class="cards">
    <div class="card">Total Rooms: <span id="totalRooms"></span></div>
    <div class="card">Available Rooms: <span id="availableRooms"></span></div>
    <div class="card">Total Students: <span id="totalStudents"></span></div>
    <div class="card">Total Fees: ₹<span id="totalFees"></span></div>
</div>

<h2>Search Students by Room</h2>
<input id="searchRoomNo" placeholder="Room No">
<button onclick="searchByRoom()">Search</button>

<table id="roomStudentsTable"></table>

<h2>Add Room</h2>
<input id="newRoomNo" placeholder="Room No">
<input id="newCapacity" placeholder="Capacity">
<button onclick="addRoom()">Add Room</button>
<p id="roomMsg"></p>

<script src="app.js"></script>
</body>
</html>
